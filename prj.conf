#enable GPIO peripheral
CONFIG_GPIO=y

#enable I2C
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_BMI160=y

# enable UART
CONFIG_SERIAL=y

#enable console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4

# enable BT
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CSC Sensor"
CONFIG_BT_DEVICE_APPEARANCE=1157

