#enable GPIO peripheral
CONFIG_GPIO=y

# enable timer
CONFIG_NRFX_TIMER=y
CONFIG_RTC=y
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_NRF_RTC_TIMER=y
CONFIG_COUNTER=y
CONFIG_BT_LIM_ADV_TIMEOUT=30

#enable I2C
CONFIG_I2C=y
CONFIG_SPI=y
 
# enable UART
CONFIG_SERIAL=y

#enable console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4

# enable BT
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CSC Sensor"
CONFIG_BT_DEVICE_APPEARANCE=1157

